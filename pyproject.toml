[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-churn-system"
version = "0.1.0"
description = "Production customer churn prediction system"
requires-python = ">=3.9"

dependencies = [
    "numpy",
    "pandas",
    "joblib",
    "scikit-learn",
    "streamlit",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]